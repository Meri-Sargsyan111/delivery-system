# Deployment-only override, applied on top of docker-compose.yml via:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full-stack up -d --build
#
# docker-compose.yml's kafka service now advertises both a host listener (localhost:9092,
# for MODE B) and a Docker-internal listener (kafka:29092, for MODE A) permanently - no
# per-mode override needed here anymore. Do NOT set KAFKA_ADVERTISED_LISTENERS in this
# file: it would replace (not merge with) the base file's two-listener value, silently
# reintroducing the "container can't reconnect to the broker" bug for every full-stack
# service the next time this override is applied.
#
# This file also adds a Caddy reverse proxy as the only publicly reachable service, and
# caps every JVM's heap so the whole stack (kafka + postgres + 9 Spring Boot services +
# caddy) has a chance of fitting on a small 2GB deployment box. `ports:` entries across
# compose files are concatenated, not replaced (Compose merge semantics), which is why
# docker-compose.yml itself binds every service's published port to 127.0.0.1 - only
# caddy, defined here, publishes a port to 0.0.0.0.
services:
  kafka:
    environment:
      # Default heap on cp-kafka can reach ~1G unconstrained, too much on a 2GB host.
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"

  auth-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

  order-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

  courier-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

  tracking-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

  notification-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

  chat-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

  ai-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

  payment-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

  api-gateway:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx224m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

  # Only publicly published port in the whole stack. Reverse-proxies to api-gateway over
  # the internal compose network (reachable as "api-gateway:8080" regardless of whether
  # api-gateway also publishes a host port). See ./Caddyfile - defaults to plain HTTP on
  # the bare IP; swap in a domain there once one is pointed at this server for automatic
  # Let's Encrypt HTTPS.
  #
  # --watch: Caddyfile is a read-only bind mount (see volumes below), which Caddy only
  # reads at process start - `docker compose up -d` does NOT restart this container just
  # because the file's on-disk *contents* changed, since Compose only recreates a
  # container when its service *definition* (image/env/volumes mapping/etc) changes, and
  # none of that changes when just the Caddyfile is edited. Without --watch, a corrected
  # Caddyfile can be committed and deployed while this container keeps serving its old,
  # in-memory route table indefinitely - e.g. a new API path silently 404s/falls through
  # to the frontend's SPA fallback until someone thinks to manually restart caddy.
  caddy:
    image: caddy:2-alpine
    profiles: ["full-stack"]
    restart: unless-stopped
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-gateway

volumes:
  caddy_data:
  caddy_config: