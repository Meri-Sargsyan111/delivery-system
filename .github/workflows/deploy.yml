name: Deploy

# Runs after Backend CI finishes successfully on delivery-system (not on every push -
# avoids deploying code that failed tests), plus a manual trigger for redeploys that
# don't need a new commit (e.g. after changing server-side .env values).
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [delivery-system]
  workflow_dispatch: {}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/delivery-system
            git fetch origin delivery-system
            git reset --hard origin/delivery-system
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full-stack up -d --build
            docker image prune -f
