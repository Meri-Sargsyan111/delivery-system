server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      routes:
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/orders/**

        - id: courier-service
          uri: http://localhost:8082
          predicates:
            - Path=/courier/**

        - id: tracking-service
          uri: http://localhost:8083
          predicates:
            - Path=/tracking/**

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/notifications/**