
server:
  port: 8080
  # Deployed behind Caddy (see Caddyfile) as the only reverse proxy in front of this
  # service - safe to trust its X-Forwarded-* headers so getRemoteAddress() resolves to
  # the real client IP (needed for AuthRateLimitingFilter's per-IP limiting) instead of
  # Caddy's own container address.
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8085}/auth/.well-known/jwks.json

  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 15s
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/auth/**

        # Customer lookup lives in auth-service (see CustomerController) but is mapped
        # at the root, not under /auth, so it routes the same way as every other
        # cross-service-visible resource (/orders, /courier, ...).
        - id: customer-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/customers/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/orders/**

        - id: courier-service
          uri: ${COURIER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/courier/**

        - id: tracking-service
          uri: ${TRACKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/tracking/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/notifications/**

        - id: notification-websocket
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/ws/**

        # The old global, unauthenticated courier location broadcast (/ws-location) has
        # been retired - live position now flows through tracking-service's own
        # per-order, authorization-checked WebSocket topic instead (see below).
        - id: tracking-websocket
          uri: ${TRACKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/ws-tracking/**

        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/chat/**

        - id: chat-websocket
          uri: ${CHAT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/ws-chat/**

        # AiChatController is itself mapped at /api/ai/chat, so this is forwarded as-is
        # - no rewrite.
        - id: ai-service-chat
          uri: ${AI_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/ai/chat

        # EstimateController is mapped at /ai/estimate (not /api/ai/estimate), so a
        # request under the /api prefix must be rewritten before forwarding. Deliberately
        # a separate route from ai-service-estimate-direct below - each Path predicate
        # here matches exactly one real upstream shape, so nothing else needs a rewrite
        # filter applied "just in case" (RewritePath being a no-op on non-matching paths
        # was a "combine and hope" approach; this is one route per actual meaning).
        - id: ai-service-estimate-api
          uri: ${AI_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/ai/estimate
          filters:
            - RewritePath=/api/ai/estimate, /ai/estimate

        # Direct calls to /ai/estimate already match ai-service's real mapping - forward
        # as-is, no rewrite.
        - id: ai-service-estimate-direct
          uri: ${AI_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/ai/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/payments/**