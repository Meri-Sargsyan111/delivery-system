# Two ways to run this project - do not mix them (see README note below):
#
# MODE B (default, `docker compose up -d`): native/IntelliJ-run Spring Boot services
# + Angular dev server, with Docker providing ONLY Kafka as shared infrastructure.
# This is the actively-used local development setup - all `application.yml` files
# default to `localhost:9092` / `localhost:5432` for exactly this mode. Postgres itself
# runs natively (not in Docker) in this mode, so it's deliberately NOT started by
# default here - a Dockerized Postgres alongside a native one on the same port is
# exactly the "duplicate instance" confusion this file used to cause.
#
# MODE A (opt-in, `docker compose --profile full-stack up -d --build`): the complete,
# self-contained stack - every service plus its own dedicated Postgres, entirely inside
# Docker's network. Useful for testing a real deployment, but must not run at the same
# time as Mode B (identical host ports). See each service's application.yml for the
# environment-variable overrides (AUTH_SERVICE_URL, SPRING_DATASOURCE_URL, KAFKA_BROKER,
# etc.) that redirect it from localhost defaults to Docker service hostnames.
services:

  # Always-on infra for MODE B: the one piece of shared infrastructure that doesn't
  # have a native-Windows equivalent already running (unlike Postgres - see above).
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Advertises localhost:9092 - correct for MODE B, where every client (native
      # Spring Boot services, this host's own tooling) connects from outside Docker's
      # network. This must change to kafka:9092 only if MODE A's containers are the
      # ones talking to this same broker instead - the two modes need different values,
      # which is exactly why they must not run simultaneously.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Everything below is MODE A only - never started by a bare `docker compose up`.

  postgres:
    image: postgres:15
    profiles: ["full-stack"]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: deliverydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./backend/auth-service
    profiles: ["full-stack"]
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - auth_jwt_keys:/app/keys
      - auth_avatars:/app/uploads/avatars
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Persistent RS256 keypair (see JwtKeyConfig): without this, every restart generates
      # a brand-new ephemeral in-memory keypair, silently invalidating every issued JWT for
      # every user - the exact cause of intermittent 401s (surfaced by the frontend as a
      # generic "failed, please try again" on whatever action the user happened to take
      # next) right after any deploy. Files are generated once directly into the
      # auth_jwt_keys volume on the server; see deploy notes.
      JWT_PRIVATE_KEY_LOCATION: /app/keys/private_key.pem
      JWT_PUBLIC_KEY_LOCATION: /app/keys/public_key.pem
      AVATAR_UPLOAD_DIR: /app/uploads/avatars
      # Sends the post-registration welcome email (see EmailServiceImpl). Real values come
      # from a project-root .env file (gitignored, never committed) via Compose's own
      # variable substitution - same account/credentials as notification-service below.
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # Bootstrap ROLE_ADMIN account (see AdminSeeder). Falls back to the same dev-only
      # default as application.yml when unset - override both in the project-root .env
      # for any real deployment so the seeded admin isn't a publicly-known credential.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@delivery.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}

  order-service:
    build: ./backend/order-service
    profiles: ["full-stack"]
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      AUTH_SERVICE_URL: http://auth-service:8085
      COURIER_SERVICE_URL: http://courier-service:8082
      KAFKA_BROKER: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deliverydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  courier-service:
    build: ./backend/courier-service
    profiles: ["full-stack"]
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - courier_avatars:/app/uploads/avatars
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      AUTH_SERVICE_URL: http://auth-service:8085
      ORDER_SERVICE_URL: http://order-service:8081
      KAFKA_BROKER: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deliverydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AVATAR_STORAGE_PATH: /app/uploads/avatars

  tracking-service:
    build: ./backend/tracking-service
    profiles: ["full-stack"]
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      AUTH_SERVICE_URL: http://auth-service:8085
      KAFKA_BROKER: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deliverydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  notification-service:
    build: ./backend/notification-service
    profiles: ["full-stack"]
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      AUTH_SERVICE_URL: http://auth-service:8085
      KAFKA_BROKER: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deliverydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Real SMTP credentials are dev-machine-local secrets, never committed (see project-root
      # .env, gitignored). Mail sending is best-effort (NotificationServiceImpl logs a
      # warning and continues on failure), so an unset .env still lets the container start
      # and every other notification path (DB, WebSocket) work normally without real mail.
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

  chat-service:
    build: ./backend/chat-service
    profiles: ["full-stack"]
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      AUTH_SERVICE_URL: http://auth-service:8085
      KAFKA_BROKER: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chatdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  api-gateway:
    build: ./backend/api-gateway
    profiles: ["full-stack"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      order-service:
        condition: service_started
      courier-service:
        condition: service_started
      tracking-service:
        condition: service_started
      notification-service:
        condition: service_started
      chat-service:
        condition: service_started
    environment:
      AUTH_SERVICE_URL: http://auth-service:8085
      ORDER_SERVICE_URL: http://order-service:8081
      COURIER_SERVICE_URL: http://courier-service:8082
      TRACKING_SERVICE_URL: http://tracking-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      CHAT_SERVICE_URL: http://chat-service:8086

# Named volumes (MODE A only): survive container recreation/rebuilds, unlike the
# container's own writable layer.
volumes:
  courier_avatars:
  auth_jwt_keys:
  auth_avatars: